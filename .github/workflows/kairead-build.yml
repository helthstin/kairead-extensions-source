
name: Kairead Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar DragonTranslation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar extensiones Kairead
        run: |
          chmod +x ./gradlew

          # DragonTranslation
          ./gradlew :src:es:dragontranslationorg:spotlessApply
          ./gradlew :src:es:dragontranslationorg:assembleRelease

          # BatCave
          ./gradlew :src:en:batcave:spotlessApply
          ./gradlew :src:en:batcave:assembleRelease

          
      - name: Guardar APK de DragonTranslation
        uses: actions/upload-artifact@v4
        with:
          name: Kairead-DragonTranslation
          path: |
           src/es/dragontranslationorg/build/outputs/**/*.apk
          if-no-files-found: error
     
      - name: Guardar APK de BatCave
        uses: actions/upload-artifact@v4
        with:
          name: Kairead-BatCave
          path: |
            src/en/batcave/build/outputs/**/*.apk
          if-no-files-found: error
          
      - name: Publicar APK en KayHelthRepo
        env:
          GH_TOKEN: ${{ secrets.KAYHELTH_REPO_TOKEN }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import subprocess
          import tempfile

          apks = glob.glob(
              "src/es/dragontranslationorg/build/outputs/**/*.apk",
              recursive=True,
          )
          if len(apks) != 1:
              raise SystemExit(f"Se esperaba una APK, encontradas: {apks}")

          with tempfile.TemporaryDirectory() as directory:
              subprocess.run([
                  "git", "clone",
                  "https://x-access-token:" + os.environ["GH_TOKEN"] +
                  "@github.com/helthstin/KayHelthRepo.git",
                  directory,
              ], check=True)

              import shutil
              destination = os.path.join(directory, "apk")
              os.makedirs(destination, exist_ok=True)
              shutil.copy2(apks[0], destination)

              subprocess.run(
                  ["git", "-C", directory, "add", "apk/"],
                  check=True,
              )
              changed = subprocess.run(
                  ["git", "-C", directory, "diff", "--cached", "--quiet"]
              ).returncode != 0

              if changed:
                  subprocess.run([
                      "git", "-C", directory, "config",
                      "user.name", "github-actions[bot]",
                  ], check=True)
                  subprocess.run([
                      "git", "-C", directory, "config",
                      "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com",
                  ], check=True)
                  subprocess.run([
                      "git", "-C", directory, "commit",
                      "-m", "Publicar APK de DragonTranslation",
                  ], check=True)
                  subprocess.run(
                      ["git", "-C", directory, "push"],
                      check=True,
                  )
          PY
          

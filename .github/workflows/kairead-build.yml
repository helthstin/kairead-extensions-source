
name: Kairead Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar DragonTranslation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar extensiones Kairead
        run: |
          chmod +x ./gradlew

          EXTENSIONES=$(python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          config = json.loads(Path("kairead-extensions.json").read_text())
          extensiones = config["extensions"]

          if not extensiones:
              raise ValueError("La lista de extensiones está vacía")

          for extension in extensiones:
              if not re.fullmatch(r"[a-z]{2,3}/[a-z0-9_]+", extension):
                  raise ValueError(f"Nombre de extensión inválido: {extension}")

              if not Path(f"src/{extension}/build.gradle.kts").is_file():
                  raise FileNotFoundError(f"Extensión no encontrada: {extension}")

              print(extension)
          PY
          )

          while IFS= read -r extension; do
            tarea="${extension//\//:}"

            echo "Compilando: $extension"

            ./gradlew ":src:$tarea:spotlessApply"
            ./gradlew ":src:$tarea:assembleRelease"

          done <<< "$EXTENSIONES"

          
      - name: Guardar APK de DragonTranslation
        uses: actions/upload-artifact@v4
        with:
          name: Kairead-DragonTranslation
          path: |
           src/es/dragontranslationorg/build/outputs/**/*.apk
          if-no-files-found: error
     
      - name: Guardar APK de BatCave
        uses: actions/upload-artifact@v4
        with:
          name: Kairead-BatCave
          path: |
            src/en/batcave/build/outputs/**/*.apk
          if-no-files-found: error
      
      - name: Publicar APKs en KayHelthRepo
        env:
          GH_TOKEN: ${{ secrets.KAYHELTH_REPO_TOKEN }}
        run: |
          python3 - <<'PY'
          import glob
          import os
          import shutil
          import subprocess
          import tempfile

          extensiones = {
              "DragonTranslation": "src/es/dragontranslationorg",
              "BatCave": "src/en/batcave",
          }

          apks = {}

          for nombre, carpeta in extensiones.items():
              archivos = glob.glob(
                  f"{carpeta}/build/outputs/**/*.apk",
                  recursive=True,
              )

              if len(archivos) != 1:
                  raise SystemExit(
                      f"{nombre}: se esperaba una APK, encontradas: {archivos}"
                  )

              apks[nombre] = archivos[0]

          with tempfile.TemporaryDirectory() as directory:
              subprocess.run([
                  "git", "clone",
                  "https://x-access-token:" + os.environ["GH_TOKEN"] +
                  "@github.com/helthstin/KayHelthRepo.git",
                  directory,
              ], check=True)

              destino = os.path.join(directory, "apk")
              os.makedirs(destino, exist_ok=True)

              for nombre, archivo in apks.items():
                  shutil.copy2(archivo, destino)
                  print(f"APK preparada: {nombre}")

              subprocess.run([
                  "git", "-C", directory, "add", "apk/"
              ], check=True)

              cambios = subprocess.run([
                  "git", "-C", directory,
                  "diff", "--cached", "--quiet"
              ]).returncode != 0

              if cambios:
                  subprocess.run([
                      "git", "-C", directory, "config",
                      "user.name", "github-actions[bot]"
                  ], check=True)

                  subprocess.run([
                      "git", "-C", directory, "config",
                      "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com"
                  ], check=True)

                  subprocess.run([
                      "git", "-C", directory, "commit",
                      "-m", "Publicar extensiones Kairead"
                  ], check=True)

                  subprocess.run([
                      "git", "-C", directory, "push"
                  ], check=True)

                  print("Extensiones publicadas correctamente")
              else:
                  print("No hay APKs nuevas para publicar")
          PY
